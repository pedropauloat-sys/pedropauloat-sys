<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <defs>
    <linearGradient id="spaceGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a15" />
      <stop offset="50%" stop-color="#0a1936" />
      <stop offset="100%" stop-color="#110d26" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#spaceGradient)" />

  <g fill="#FFF">
    <!-- Starfield with simple animations -->
    <circle cx="65" cy="45" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="180" r="1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="90" r="2.5" filter="url(#glow)"><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="200" r="1.5"/>
    <circle cx="450" cy="60" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="150" r="1"/>
    <circle cx="690" cy="50" r="2.5" filter="url(#glow)"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="220" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
    <!-- More static stars -->
    <circle cx="180" cy="40" r="1" />
    <circle cx="410" cy="130" r="1.5" />
    <circle cx="520" cy="20" r="1" />
    <circle cx="240" cy="210" r="1" />
  </g>

  <!-- Flying Rocket -->
  <g>
    <!-- Diagonal Path Animation -->
    <animateTransform attributeName="transform" type="translate" from="-100,280" to="900,-50" dur="5s" repeatCount="indefinite" />
    <!-- Rocket Rotation -->
    <g transform="rotate(45)">
      <!-- Rocket Fire (animated scale for thrust) -->
      <g transform="translate(0, 0)">
        <path d="M -6 0 L 0 25 L 6 0 Z" fill="#FF5722">
          <animateTransform attributeName="transform" type="scale" values="1,1; 1,1.5; 1,1" dur="0.2s" repeatCount="indefinite" />
        </path>
        <path d="M -3 0 L 0 15 L 3 0 Z" fill="#FFEB3B">
          <animateTransform attributeName="transform" type="scale" values="1,1; 1,1.3; 1,1" dur="0.2s" repeatCount="indefinite" />
        </path>
      </g>
      
      <!-- Body -->
      <path d="M -12 -20 C -12 -50 0 -65 0 -65 C 0 -65 12 -50 12 -20 L 10 0 L -10 0 Z" fill="#E0E0E0" />
      
      <!-- Fins -->
      <path d="M -10 -10 L -25 5 L -10 0 Z" fill="#D32F2F" />
      <path d="M 10 -10 L 25 5 L 10 0 Z" fill="#D32F2F" />
      <path d="M -2 0 L 2 0 L 0 10 Z" fill="#B71C1C" />
      
      <!-- Window -->
      <circle cx="0" cy="-35" r="4.5" fill="#1565C0" stroke="#757575" stroke-width="1.5" />
      <circle cx="-1" cy="-36" r="1.5" fill="#64B5F6" />
    </g>
  </g>

</svg>
